name: Check generated comparison

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up npm
        run: |
          required_npm="$(node -p "require('$GITHUB_WORKSPACE/package.json').packageManager.split('@').at(-1)")"
          npm install --global "npm@$required_npm"
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Check data and generated comparison
        run: npm run check

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      - name: Scan for secrets
        run: gitleaks dir . --redact --config .gitleaks.toml
