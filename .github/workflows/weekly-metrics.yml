name: Weekly project metrics

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-project-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up npm
        run: |
          required_npm="$(node -p "require('$GITHUB_WORKSPACE/package.json').packageManager.split('@').at(-1)")"
          npm install --global "npm@$required_npm"
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Refresh GitHub metrics
        run: npm run metrics:refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Regenerate comparison documents
        run: npm run generate

      - name: Check public source links
        run: npm run metrics:check-links

      - name: Validate refreshed output
        run: npm run check

      - name: Commit changed metrics
        run: |
          if git diff --quiet; then
            echo "Project metrics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.yml README.md EVIDENCE.md METHODOLOGY.md
          git commit -m "chore(data): refresh weekly project metrics"
          git push
